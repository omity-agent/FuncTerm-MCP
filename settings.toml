# 本地 Daemon 的 IPC 服务名
daemon_service_name = "functerm/daemon"

# Daemon 结构化诊断的过滤规则；设为 functerm=debug 可观察命令生命周期。
diagnostics_filter = "warn"

# Shell PTY 的默认行数。
terminal_rows = 30

# Shell PTY 的默认列数。
terminal_cols = 120

# 对外展示并在每条命令开始前恢复的模型标题。
terminal_model_title = ""

# Shell 启动注入脚本写入 ready 文件前最多等待的秒数。
shell_startup_timeout_seconds = 60.0

# 默认加载 Shell Profile
shell_load_profile = true

# 忽略 Shell Profile 中的提示符、颜色和 Shell 集成样式
shell_ignore_style = true

# 是否默认分别捕获 stdout 和 stderr；false 时保留终端句柄并捕获合并的终端输出。
command_separate_output = false

# 命令输出计数与 View Token 起始位置使用的内置分词编码。
output_token_encoding = "o200k_base"

# Root Daemon 创建普通权限 Tab 时使用的 Unix 用户；留空时使用 Daemon 的真实 UID 或 SUDO_UID。
# 可通过 FUNCTERM_UNIX_NORMAL_USER 指定
unix_normal_user = ""

# PowerShell 可执行文件候选
powershell = ["pwsh", "powershell"]

# Bash 可执行文件候选。
bash = ["bash"]

# NuShell 可执行文件候选。
nushell = ["nu"]

# Zsh 可执行文件候选。
zsh = ["zsh"]

# Windows CMD 可执行文件候选。
cmd = ["cmd"]

# Bun 可执行文件候选。
bun = ["bun"]

# Python 可执行文件候选。
python = ["python3", "python"]

[benchmark]
# 请求路径累计活跃计时；通过 FUNCTERM_BENCHMARK_PROCESSING_TIMING 临时启用。
processing_timing = false

[ipc]
# IPC 连接建立与 Daemon 探测的最长等待秒数
setup_timeout_seconds = 15.0

# daemon stop/restart 等待所有终端会话清理完成的最长秒数。
shutdown_timeout_seconds = 45.0

# 单条 IPC 消息的最大字节数
max_frame_bytes = 67108864

# Daemon 中可同时执行的阻塞操作数
blocking_concurrency = 32

# Windows IPC 管道与互斥锁仅授予 SYSTEM 及当前用户访问权限；{user_sid} 从进程令牌读取。
windows_access_control = "D:P(A;;GA;;;SY)(A;;GA;;;{user_sid})"

# 中等完整性标签允许已获 DACL 授权的普通权限客户端访问管理员 Daemon 的管道与互斥锁。
windows_security_label = "S:(ML;;NW;;;ME)"

[mcp.http]
# Daemon 内置的无身份验证 MCP HTTP 服务；默认允许所有 IPv4 网络接口访问。
# 可通过 FUNCTERM_MCP_HTTP_BIND 覆盖；端口 0 由系统分配。
bind_address = "0.0.0.0:3000"

# Streamable HTTP 的统一 POST、GET 和 DELETE 端点。
path = "/mcp"

# 允许的 Host 名称或 host:port；空数组允许任意 Host，适用于直接通过 IP 访问。
allowed_hosts = []

# 允许的浏览器 Origin，包含协议与明确端口；空数组拒绝所有携带 Origin 的请求。
# 不携带 Origin 的原生 MCP 客户端不受此列表限制。
allowed_origins = []

# 单条 HTTP 请求体的最大字节数。
max_request_body_bytes = 67108864

# 可选固定策略，取消注释后隐藏对应工具参数；默认由每次工具调用指定。
# privilege_mode = "normal" # normal 或 elevated
# output_mode = "terminal" # terminal 或 separated

# MCP 工具及其参数的描述；描述设为空字符串时不向 MCP 客户端提供该描述。
[mcp.new_tab]
description = "打开新的终端标签页。返回 tab_id。Tab 是有状态的持久会话。"

[mcp.new_tab.parameters]
exec = ""

[mcp.new_tab.exec_parameters]
starting_directory = "初始位置。已有的 Tab 也可通过 send_command 改变 cwd（如 `cd` 命令）。"
starting_shell = "启动时使用的交互式命令环境。在 Windows 系统，Bash 对应 MSYS2。"
elevated = "默认为 false（普通权限）"

[mcp.manual_write]
description = "手动写入键盘输入。适用于使用 TUI 程序、点击快捷键等场景。调用时需在 text 和 bytes 中选择一个传入。"

[mcp.manual_write.parameters]
exec = ""
wait_timeout = "等待终端产生新输出的最长时长，单位为秒。输入 0 代表写入后立即返回，此时可能尚未更新。"

[mcp.manual_write.exec_parameters]
tab_id = "该工具仅在 Tab 处于非空闲状态时有效"
text = "要写入的 UTF-8 文本"
bytes = "要写入的原始字节"

[mcp.send_command]
description = "执行命令。工具会在等待时长结束或命令结束时输出。"

[mcp.send_command.parameters]
exec = "向一个或多个不同的 Tab 发送命令"
wait_timeout = "等待时长，单位为秒。时间结束后命令不会被终止，仍可通过 view 查看其状态。对于一般命令，**等待时长设置过小会造成不必要的轮询和重复输出**；等待时长设置过大会导致出现异常高耗时时无法及时处理。通常建议设置略大于预期耗时，建议根据上一次执行类似命令结束时的 Time Consumption 动态更正预期。若非计划在命令结束前同时做其他事，不建议设为个位数。"

[mcp.send_command.exec_parameters]
tab_id = "每个 Tab 在同一时刻仅能有一份命令正在运行，Tab 繁忙时收到的命令会被丢弃。"
command = "Single-line or multi-line commands"
separate_output = "是否分别捕获 stdout 和 stderr。false 时保留终端句柄。"

[mcp.view]
description = "查看状态。该工具会在等待时长结束或命令结束时输出。"

[mcp.view.parameters]
ids = "如果输入命令 ID，将返回该命令目前的状态；如果输入标签页 ID，将返回终端屏幕范围内显示的内容。一般输入命令 ID。"
wait_timeout = "等待时长，单位为秒。"
start_token = "输出起始 Token 的索引。用于跳过输出中已经读过的部分；默认值为 1；不适用于 Separate Output。"
