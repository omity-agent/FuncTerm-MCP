# 本地 Daemon 的 iceoryx2 服务名；MCP 与 CLI 均通过它复用同一个 Shell 管理实例。
daemon_service_name = "shell_mcp_pty/daemon"

# Shell PTY 的默认行数。
terminal_rows = 30

# Shell PTY 的默认列数。
terminal_cols = 120

# Windows PowerShell 可执行文件名称。
windows_powershell = "powershell.exe"

# PowerShell 7+ 可执行文件名称。
pwsh = "pwsh.exe"

# Bash 可执行文件名称。
bash = "bash.exe"

# NuShell 可执行文件名称。
nushell = "nu.exe"
