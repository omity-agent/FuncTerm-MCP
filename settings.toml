# 本地 Daemon 的 IPC 服务名；MCP 与 CLI 均通过它复用同一个 Shell 管理实例。
daemon_service_name = "functerm/daemon"

# Shell PTY 的默认行数。
terminal_rows = 30

# Shell PTY 的默认列数。
terminal_cols = 120

# Shell 尚未设置窗口标题时使用的初始标题。
terminal_initial_title = "FuncTerm"

# Shell 启动注入脚本写入 ready 文件前最多等待的秒数。
shell_startup_timeout_seconds = 30.0

# PowerShell 可执行文件候选
powershell = ["pwsh.exe", "powershell.exe"]

# Bash 可执行文件名称。
bash = "bash.exe"

# NuShell 可执行文件名称。
nushell = "nu.exe"

# Zsh 可执行文件名称。
zsh = "zsh"

# Windows CMD 可执行文件名称。
cmd = "cmd.exe"
