# 每个 profile 对应一个并发 MCP 客户端；count 必须与 profiles 数量一致，避免多个客户端走同一条路径。
clients:
  count: 4
  # 每个客户端重复执行自身完整 scenario 的次数；用于拉长总耗时并观察长期真实路径表现。
  loop_count: 5
  list_tools_on_connect: true
  profiles:
    - name: inventory_reader
      variables:
        role: inventory
      scenario:
        - name: open_inventory_tab
          tool: new_tab
          arguments:
            starting_directory: "."
            starting_shell: "powershell"
          capture:
            tab_id: "TAB_ID"
        - name: inspect_initial_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: locate_workspace
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-Location | Select-Object -ExpandProperty Path"
            waiting: 5
          capture:
            locate_command_id: "COMMAND_ID"
        - name: inspect_location_result
          tool: view
          arguments:
            id: "${locate_command_id}"
            waiting: 0
        - name: list_workspace_roots
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-ChildItem -Force | Select-Object -First 12 Name,Mode | Format-Table -AutoSize | Out-String"
            waiting: 5
          capture:
            list_command_id: "COMMAND_ID"
        - name: inspect_root_listing
          tool: view
          arguments:
            id: "${list_command_id}"
            waiting: 0
        - name: count_source_files
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "(Get-ChildItem -Recurse -File .\\src | Measure-Object).Count"
            waiting: 5
          capture:
            count_command_id: "COMMAND_ID"
        - name: inspect_source_count
          tool: view
          arguments:
            id: "${count_command_id}"
            waiting: 0
        - name: sample_docs
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-ChildItem .\\docs -Recurse -File | Select-Object -First 5 FullName | Out-String"
            waiting: 5
          capture:
            docs_command_id: "COMMAND_ID"
        - name: inspect_docs_sample
          tool: view
          arguments:
            id: "${docs_command_id}"
            waiting: 0
        - name: emit_inventory_marker
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "[pscustomobject]@{client='${client.name}';role='${role}';phase='marker'} | ConvertTo-Json -Compress"
            waiting: 5
          capture:
            marker_command_id: "COMMAND_ID"
        - name: inspect_inventory_marker
          tool: view
          arguments:
            id: "${marker_command_id}"
            waiting: 0
        - name: inspect_inventory_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: complete_inventory_path
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Write-Output 'inventory path complete for ${client.name}'"
            waiting: 5
          capture:
            done_command_id: "COMMAND_ID"
        - name: inspect_inventory_completion
          tool: view
          arguments:
            id: "${done_command_id}"
            waiting: 0
        - name: inspect_inventory_final_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0

    - name: source_navigator
      variables:
        role: navigation
      scenario:
        - name: open_source_tab
          tool: new_tab
          arguments:
            starting_directory: "."
            starting_shell: "powershell"
          capture:
            tab_id: "TAB_ID"
        - name: view_source_prompt
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: enter_src
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Set-Location .\\src; Get-Location | Select-Object -ExpandProperty Path"
            waiting: 5
          capture:
            enter_src_command_id: "COMMAND_ID"
        - name: view_enter_src
          tool: view
          arguments:
            id: "${enter_src_command_id}"
            waiting: 0
        - name: list_engine_modules
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-ChildItem .\\engine -File | Select-Object Name,Length | Format-Table -AutoSize | Out-String"
            waiting: 5
          capture:
            engine_command_id: "COMMAND_ID"
        - name: view_engine_modules
          tool: view
          arguments:
            id: "${engine_command_id}"
            waiting: 0
        - name: enter_runtime
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Set-Location .\\engine\\runtime; Get-ChildItem -Directory | Select-Object Name | Out-String"
            waiting: 5
          capture:
            runtime_command_id: "COMMAND_ID"
        - name: view_runtime_directories
          tool: view
          arguments:
            id: "${runtime_command_id}"
            waiting: 0
        - name: inspect_protocol_files
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-ChildItem .\\protocol -File | Select-Object Name,Length | Format-Table -AutoSize | Out-String"
            waiting: 5
          capture:
            protocol_command_id: "COMMAND_ID"
        - name: view_protocol_files
          tool: view
          arguments:
            id: "${protocol_command_id}"
            waiting: 0
        - name: return_workspace
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Set-Location ..\\..\\..; Get-Location | Select-Object -ExpandProperty Path"
            waiting: 5
          capture:
            return_command_id: "COMMAND_ID"
        - name: view_return_workspace
          tool: view
          arguments:
            id: "${return_command_id}"
            waiting: 0
        - name: inspect_source_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: summarize_navigation
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Write-Output 'navigation path complete for ${client.name}'"
            waiting: 5
          capture:
            summary_command_id: "COMMAND_ID"
        - name: view_navigation_summary
          tool: view
          arguments:
            id: "${summary_command_id}"
            waiting: 0
        - name: view_navigation_final_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0

    - name: toolchain_checker
      variables:
        role: diagnostics
      scenario:
        - name: open_toolchain_tab
          tool: new_tab
          arguments:
            starting_directory: "."
            starting_shell: "powershell"
          capture:
            tab_id: "TAB_ID"
        - name: view_toolchain_prompt
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: inspect_powershell_version
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "$PSVersionTable | Out-String"
            waiting: 5
          capture:
            ps_command_id: "COMMAND_ID"
        - name: view_powershell_version
          tool: view
          arguments:
            id: "${ps_command_id}"
            waiting: 0
        - name: inspect_rust_tooling
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-Command cargo,rustc -ErrorAction SilentlyContinue | Select-Object Name,Source | Format-Table -AutoSize | Out-String"
            waiting: 5
          capture:
            rust_tools_command_id: "COMMAND_ID"
        - name: view_rust_tooling
          tool: view
          arguments:
            id: "${rust_tools_command_id}"
            waiting: 0
        - name: inspect_search_tooling
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-Command rg,uv,essence -ErrorAction SilentlyContinue | Select-Object Name,Source | Format-Table -AutoSize | Out-String"
            waiting: 5
          capture:
            search_tools_command_id: "COMMAND_ID"
        - name: view_search_tooling
          tool: view
          arguments:
            id: "${search_tools_command_id}"
            waiting: 0
        - name: inspect_selected_environment
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-ChildItem Env: | Where-Object Name -in 'PATH','TEMP','USERPROFILE' | Select-Object Name,Value | Out-String"
            waiting: 5
          capture:
            env_command_id: "COMMAND_ID"
        - name: view_selected_environment
          tool: view
          arguments:
            id: "${env_command_id}"
            waiting: 0
        - name: inspect_settings_file
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Get-Content .\\settings.toml -TotalCount 20 | Out-String"
            waiting: 5
          capture:
            settings_command_id: "COMMAND_ID"
        - name: view_settings_file
          tool: view
          arguments:
            id: "${settings_command_id}"
            waiting: 0
        - name: view_toolchain_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: complete_toolchain_path
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Write-Output 'toolchain path complete for ${client.name}'"
            waiting: 5
          capture:
            complete_command_id: "COMMAND_ID"
        - name: view_toolchain_completion
          tool: view
          arguments:
            id: "${complete_command_id}"
            waiting: 0
        - name: view_toolchain_final_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0

    - name: stream_observer
      variables:
        role: stream
      scenario:
        - name: open_stream_tab
          tool: new_tab
          arguments:
            starting_directory: "."
            starting_shell: "powershell"
          capture:
            tab_id: "TAB_ID"
        - name: view_stream_prompt
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: emit_stdout_sequence
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "1..5 | ForEach-Object { Write-Output \"stdout item $_ for ${client.name}\" }"
            waiting: 5
          capture:
            stdout_command_id: "COMMAND_ID"
        - name: view_stdout_sequence
          tool: view
          arguments:
            id: "${stdout_command_id}"
            waiting: 0
        - name: emit_stderr_sequence
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Write-Error 'expected stderr sample for ${client.name}'; Write-Output 'stdout still continues'"
            waiting: 5
          capture:
            stderr_command_id: "COMMAND_ID"
        - name: view_stderr_sequence
          tool: view
          arguments:
            id: "${stderr_command_id}"
            waiting: 0
        - name: run_short_waiting_command
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Start-Sleep -Milliseconds 250; Write-Output 'delayed output for ${client.name}'"
            waiting: 5
          capture:
            delayed_command_id: "COMMAND_ID"
        - name: view_delayed_command
          tool: view
          arguments:
            id: "${delayed_command_id}"
            waiting: 0
        - name: detach_running_command
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Start-Sleep -Milliseconds 600; Write-Output 'detached completion for ${client.name}'"
            waiting: 0
          capture:
            detached_command_id: "COMMAND_ID"
        - name: wait_for_detached_command
          tool: view
          arguments:
            id: "${detached_command_id}"
            waiting: 5
        - name: inspect_stream_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0
        - name: emit_structured_stream_marker
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "[pscustomobject]@{client='${client.name}';role='${role}';streams='stdout-stderr-detached'} | ConvertTo-Json -Compress"
            waiting: 5
          capture:
            marker_command_id: "COMMAND_ID"
        - name: view_stream_marker
          tool: view
          arguments:
            id: "${marker_command_id}"
            waiting: 0
        - name: complete_stream_path
          tool: send_command
          arguments:
            tab_id: "${tab_id}"
            command: "Write-Output 'stream path complete for ${client.name}'"
            waiting: 5
          capture:
            complete_command_id: "COMMAND_ID"
        - name: view_stream_completion
          tool: view
          arguments:
            id: "${complete_command_id}"
            waiting: 0
        - name: view_stream_final_screen
          tool: view
          arguments:
            id: "${tab_id}"
            waiting: 0

# FuncTerm MCP 服务器启动方式；相对路径以本配置文件所在目录为基准解析。
server:
  command:
    windows: "../../target/release/functerm.exe"
    unix: "../../target/release/functerm"
  args: ["mcp"]
  cwd: "../.."
  env: {}

# 报告输出目录与文件名；目录相对路径以本配置文件所在目录为基准解析。
report:
  directory: "reports"
  summary_file: "summary.json"
  events_file: "events.jsonl"
