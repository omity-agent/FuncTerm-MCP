cargo-features = [
    "different-binary-name",
    "metabuild",
    "multiple-build-scripts",
    "open-namespaces",
    "panic-immediate-abort",
    "path-bases",
    "unstable-editions",
]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
big_endian_bytes = "allow"
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
cast_precision_loss = "allow"
create_dir = "allow"
else_if_without_else = "allow"
exhaustive_structs = "allow"
field_scoped_visibility_modifiers = "allow"
float_arithmetic = "allow"
implicit_return = "allow"
inline_modules = "allow"
integer_division_remainder_used = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_trait_methods = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_without_reason = "allow"
non_ascii_literal = "allow"
panic = "allow"
print_stderr = "allow"
print_stdout = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_pub_crate = "allow"
self_named_module_files = "allow"
semicolon_outside_block = "allow"
separated_literal_suffix = "allow"
similar_names = "allow"
single_call_fn = "allow"
struct_excessive_bools = "allow"
tests_outside_test_module = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "allow"
unneeded_field_pattern = "allow"
unwrap_used = "allow"
use_debug = "allow"
wildcard_dependencies = "allow"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
refining_impl_trait = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

missing_docs = "allow"

[profile.release]
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "immediate-abort"
incremental = false
codegen-units = 1
rpath = false
trim-paths = "all"
codegen-backend = "llvm"

[package]
name = "functerm"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = { git = "https://github.com/dtolnay/anyhow", public = true }
axum = { version = "*", default-features = false, features = [
    "http1",
    "tokio",
] }
base64-turbo = "*"
blake3 = "*"
bon = { git = "https://github.com/elastio/bon" }
bytestring = { git = "https://github.com/actix/actix-net", features = [
    "serde",
] }
clap = { git = "https://github.com/clap-rs/clap", features = [
    "derive",
    "deprecated",
    "string",
    "wrap_help",
], public = true }
dashmap = "*"
encoding_rs = "*"
event-listener = "*"
fast-strip-ansi = "*"
fs-err = "*"
futures-util = { version = "*", features = ["sink"] }
humantime = "*"
interprocess = { version = "*", features = ["tokio"] }
itertools = "*"
named-lock = "*"
nanoid = "*"
notify = "*"
parking_lot = "*"
portable-pty = { git = "https://github.com/wez/wezterm" }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "*"
same-file = "*"
serde = { version = "*", features = ["derive", "unstable"] }
serde_bytes = "*"
shell-words = "*"
snmalloc-rs = { git = "https://github.com/microsoft/snmalloc", features = [
    "native-cpu",
    "lto",
] }
sonic-rs = { git = "https://github.com/cloudwego/sonic-rs" }
strum = { version = "*", features = ["derive"] }
sugar_path = "*"
tastty-core = "*"
tempfile = "*"
thiserror = { git = "https://github.com/dtolnay/thiserror" }
tokio = { version = "*", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-serde = { version = "*", features = ["messagepack"] }
tokio-util = { version = "*", features = ["codec", "rt"] }
toktok-rs = { git = "https://github.com/vectorize-io/toktok" }
toml = "*"
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
vte = { git = "https://github.com/alacritty/vte" }
which = "*"

[dev-dependencies]
kill_tree = "*"
reqwest = { version = "*", default-features = false, features = ["blocking"] }
rmp-serde = "*"
wait-timeout = "*"

[patch.crates-io]
anyhow = { git = "https://github.com/dtolnay/anyhow" }

[target.'cfg(unix)'.dependencies]
kill_tree = "*"
exacl = "*"
nix = { version = "*", features = ["user"] }
privdrop = "*"
rustix = { version = "*", features = ["process"] }

[target.'cfg(windows)'.dependencies]
os_pipe = "*"
widestring = "*"
windows-spawn = "*"
windows = { git = "https://github.com/microsoft/windows-rs", features = [
    "consoleapi",
    "consoleapi2",
    "jobapi",
    "jobapi2",
    "processenv",
    "processthreadsapi",
    "sddl",
    "securitybaseapi",
    "synchapi",
    "winbase",
    "winerror",
    "winuser",
] }
